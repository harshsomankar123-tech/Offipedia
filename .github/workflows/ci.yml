name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt (Linting)
        run: ./gradlew detekt

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Flaky Test History
        uses: actions/cache@v4
        with:
          path: flaky-tests.json
          key: flaky-tests-${{ github.run_id }}
          restore-keys: |
            flaky-tests-

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Flaky Test Reporter
        run: ./gradlew runFlakyReporter
        if: always()

      - name: Post Flaky Report to Summary
        run: |
          if [ -f flaky-report.md ]; then
            cat flaky-report.md >> $GITHUB_STEP_SUMMARY
          fi
        if: always()

      - name: Upload Flaky Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report
          path: |
            flaky-report.md
            flaky-tests.json
        if: always()

      - name: Generate Coverage Report
        run: ./gradlew koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./composeApp/build/reports/kover/report.xml
          fail_ci_if_error: false

      - name: Run Paparazzi Tests
        run: ./gradlew verifyPaparazziDebug
        continue-on-error: true

  instrumentation-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 2700
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew connectedCheck
